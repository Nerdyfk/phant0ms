<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <title>PhantomS – Wallet Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- XLSX -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: "#0B0F1A",
            neonBlue: "#5B8CFF",
            neonPurple: "#8A5CFF",
            neonGreen: "#3CFF8F",
            neonRed: "#FF4D4D",
            neonGold: "#FFD36A",
          },
        },
      },
    };
  </script>

  <style>
    .parallax {
      position: absolute;
      pointer-events: none;
      transition: transform 0.15s ease-out;
    }
  </style>
</head>

<body class="bg-white text-black dark:bg-bgDark dark:text-white transition-colors duration-500">

<!-- NAVBAR -->
<header class="fixed top-0 left-0 w-full z-50 px-6 py-4 flex justify-between items-center">
  <div class="text-2xl font-bold">PHANTOMS</div>

  <!-- DARK MODE TOGGLE -->
  <button id="themeToggle"
    class="w-12 h-6 rounded-full bg-gray-300 dark:bg-gray-700 relative">
    <span id="toggleDot"
      class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full transition"></span>
  </button>
</header>

<!-- HERO BACKGROUND -->
<section class="relative min-h-screen overflow-hidden pt-32">

  <!-- PARALLAX NFTS -->
  <img src="assets/nft1.png" class="parallax w-40 top-20 left-20 opacity-70" data-speed="2">
  <img src="assets/nft2.png" class="parallax w-52 bottom-32 right-32 opacity-60" data-speed="4">
  <img src="assets/nft3.png" class="parallax w-32 top-1/2 right-1/4 opacity-50" data-speed="6">

</section>

<!-- ABOUT US -->
<section class="relative z-10 py-32 px-6 max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">

  <div>
    <h2 class="text-4xl font-extrabold mb-6">
      ABOUT <span class="text-blue-500">US</span>
    </h2>

    <p class="text-gray-700 dark:text-gray-300 mb-6">
      Born from scattered pixels, Dotizen is an emerging civilization on Base,
      where each PFP carries a spark of our expanding on-chain world.
    </p>

    <p class="text-gray-700 dark:text-gray-300 mb-8">
      A PFP civilization built by citizens, powered by lore,
      forging their own on-chain society.
    </p>

    <a class="text-blue-500 font-bold hover:underline">READ THE LORE →</a>
  </div>

  <div class="grid grid-cols-2 gap-6">
    <img src="assets/nft1.png" class="rounded-2xl shadow-xl">
    <img src="assets/nft2.png" class="rounded-2xl shadow-xl">
    <img src="assets/nft3.png" class="rounded-2xl shadow-xl">
    <img src="assets/nft4.png" class="rounded-2xl shadow-xl">
  </div>
</section>

<!-- WALLET CHECKER -->
<section class="relative z-10 py-32 flex justify-center px-4">
  <div class="w-full max-w-md p-6 rounded-2xl backdrop-blur-xl bg-white/10 border border-white/20">

    <h2 class="text-2xl font-bold text-center mb-4">Wallet Checker</h2>

    <input id="walletInput"
      type="text"
      placeholder="Paste wallet address (0x...)"
      class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/20 focus:outline-none focus:border-neonBlue">

    <button onclick="checkWallet()"
      class="w-full mt-4 py-3 rounded-xl font-semibold bg-gradient-to-r from-neonBlue to-neonPurple">
      Check Status
    </button>

    <div id="result" class="hidden mt-6 p-4 rounded-xl text-center font-semibold"></div>
  </div>
</section>

<footer class="text-center py-8 text-gray-500">
  © 2026 PhantomS
</footer>

<!-- JS -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  /* DARK MODE */
  const toggle = document.getElementById("themeToggle");
  const dot = document.getElementById("toggleDot");

  toggle.onclick = () => {
    document.documentElement.classList.toggle("dark");
    dot.classList.toggle("translate-x-6");
  };

  /* PARALLAX */
  const items = document.querySelectorAll(".parallax");
  document.addEventListener("mousemove", e => {
    const x = (window.innerWidth / 2 - e.clientX) / 40;
    const y = (window.innerHeight / 2 - e.clientY) / 40;
    items.forEach(el => {
      const speed = el.dataset.speed;
      el.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
    });
  });

});

/* WHITELIST */
let whitelist = {};

// CSV
fetch("data/whitelist.csv")
  .then(r => r.ok ? r.text() : "")
  .then(csv => {
    csv.split("\n").slice(1).forEach(r => {
      const [w,s] = r.split(",");
      if (w && s) whitelist[w.trim().toLowerCase()] = s.trim().toLowerCase();
    });
  });

// XLSX
fetch("data/whitelist.xlsx")
  .then(r => r.ok ? r.arrayBuffer() : null)
  .then(buf => {
    if (!buf) return;
    const wb = XLSX.read(buf,{type:"array"});
    XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]])
      .forEach(r => whitelist[r.wallet.toLowerCase()] = r.status.toLowerCase());
  });

function checkWallet() {
  const w = walletInput.value.trim().toLowerCase();
  const r = document.getElementById("result");
  r.classList.remove("hidden");
  r.className = "mt-6 p-4 rounded-xl text-center font-semibold";

  if (!w.startsWith("0x")) {
    r.textContent = "Invalid wallet address";
    r.classList.add("text-neonRed");
    return;
  }

  const s = whitelist[w];
  if (s === "whitelisted") {
    r.textContent = "✅ WHITELISTED";
    r.classList.add("text-neonGreen");
  } else if (s === "guaranteed") {
    r.textContent = "⭐ GUARANTEED";
    r.classList.add("text-neonGold");
  } else {
    r.textContent = "❌ NOT WHITELISTED";
    r.classList.add("text-neonRed");
  }
}
</script>

</body>
</html>
