<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHANTOMS</title>

<style>
:root{--c1:#7afcff;--c2:#ff7adf}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,sans-serif;
  color:#fff;
  overflow-x:hidden;
  background:linear-gradient(120deg,#12001c,#2a003c,#120020);
  background-size:400% 400%;
  animation:bg 20s ease infinite;
}
@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
section{padding:56px 16px;text-align:center}

/* ===== BACKGROUND ===== */
.lines{position:fixed;inset:0;pointer-events:none;z-index:-2}
.lines span{
  position:absolute;left:-30%;width:160%;height:1px;
  background:linear-gradient(90deg,transparent,var(--c1),transparent);
  opacity:.25;animation:lineMove 12s linear infinite;
}
@keyframes lineMove{from{transform:translateX(0)}to{transform:translateX(30%)}}
#codebg{position:fixed;inset:0;z-index:-3}

/* ===== INTRO ===== */
#intro{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999}
#intro.hide{opacity:0;transition:.6s}
.loading-box{width:240px;height:6px;background:#222;border-radius:99px;overflow:hidden;margin:14px auto}
.loading-bar{height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c2))}

/* ===== LOGO ===== */
.top-logo{position:fixed;top:14px;left:14px;width:42px;height:42px;z-index:1000}
.top-logo img{width:100%;height:100%;animation:coinFlip 10s infinite}
@keyframes coinFlip{0%{transform:rotateY(0)}50%{transform:rotateY(360deg)}100%{transform:rotateY(360deg)}}

/* ===== HERO ===== */
.hero h1{
  font-size:46px;
  background:linear-gradient(90deg,var(--c1),var(--c2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero p{opacity:.85}

/* ===== SOCIAL ===== */
.social{display:flex;justify-content:center;gap:16px;margin:26px 0}
.social a{
  width:54px;height:54px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.07);border-radius:14px;transition:.25s;
}
.social img{width:28px;height:28px}
.social a:hover{transform:scale(1.12);box-shadow:0 0 14px var(--c1)}

/* ===== BUTTON ===== */
.btn{
  border:none;border-radius:999px;
  padding:14px 34px;margin:8px;
  font-weight:600;cursor:pointer;
  background:linear-gradient(90deg,var(--c1),var(--c2));
  color:#000;
}
#explore,#wallet{display:none}
.reveal{animation:rev .4s ease}
@keyframes rev{from{opacity:0;transform:translateY(18px)}to{opacity:1}}

input{width:100%;max-width:420px;padding:14px;border-radius:12px;border:none}

/* ===== EXPLORE ===== */
.explore-box{
  width:320px;max-width:90vw;margin:20px auto;padding:14px;
  background:rgba(0,0,0,.35);border-radius:18px;overflow:hidden;
}
.track{display:flex;gap:10px;width:max-content}
.row1{animation:l 26s linear infinite}
.row2{animation:r 30s linear infinite}
.row3{animation:l 34s linear infinite}
@keyframes l{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes r{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.track img{
  width:70px;height:70px;border-radius:12px;transition:.25s
}
.track img:hover{transform:scale(1.15);box-shadow:0 0 12px var(--c2)}

/* ===== MODAL ===== */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999}
#modal.show{display:flex}
.modal-box{background:#111;padding:28px;border-radius:18px}

.status-ok{color:#7afcff;text-shadow:0 0 10px #7afcff}
.status-no{color:#ff8a8a}

footer{padding:28px;opacity:.6;text-align:center}
  .about-text{
  max-width:720px;
  margin:40px auto 0;
  opacity:0;
  transform:translateY(20px);
  animation:aboutFade 1.1s ease forwards;
  animation-delay:.4s;
}

.about-text h2{
  font-size:26px;
  margin-bottom:12px;
  letter-spacing:1px;
}

.about-text p{
  font-size:15px;
  line-height:1.7;
  opacity:.85;
}

@keyframes aboutFade{
  to{
    opacity:1;
    transform:translateY(0);
  }
}
.action-buttons{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px;
  margin-top:18px;
}

</style>
</head>

<body>

<div class="lines">
  <span style="top:20%"></span>
  <span style="top:40%"></span>
  <span style="top:60%"></span>
  <span style="top:80%"></span>
</div>
<canvas id="codebg"></canvas>

<div id="intro">
  <div style="text-align:center">
    <h1>PHANTOMS</h1>
    <p>Welcome to the pixelated world</p>
    <div class="loading-box"><div class="loading-bar"></div></div>
    <div id="lp">0%</div>
  </div>
</div>

<div class="top-logo"><img src="assets/logo.png"></div>

<section class="hero">
  <h1>PHANTOMS</h1>
  <p>A pixel-born culture on Base</p>
  <div class="social">
    <a href="https://x.com/Phanto0ms" target="_blank"><img src="assets/x.png"></a>
    <a onclick="openModal()"><img src="assets/opensea.png"></a>
    <a onclick="openModal()"><img src="assets/magiceden.png"></a>
    <a onclick="openModal()"><img src="assets/store.png"></a>
  </div>
</section>

<section>
<div class="action-buttons">
 <button class="btn" onclick="toggleExplore()">Explore Collection</button>
  <button class="btn" onclick="toggle('wallet')">Check Wallet</button>
  <button class="btn" onclick="openModal()">Check Rarity</button>
</div>


  <!-- About text (animated, clean) -->
 <div id="about" class="about-text" style="display:none">
    <h2>About Phantoms</h2>
    <p>
      Phantoms represent the Base ecosystem, pixel culture,
      and the future of onchain art. A pixel-born identity
      evolving fully onchain.
    </p>
  </div>
</section>

<section id="explore">
  <div class="explore-box" id="gallery"></div>
</section>

<section id="wallet">
  <h2>Whitelist Check</h2>
  <input id="walletInput" placeholder="Paste wallet address">
  <br><br>
  <button class="btn" onclick="checkWallet()">Check Status</button>
  <div id="walletStatus" style="margin-top:16px;font-weight:600;"></div>
</section>

<div id="modal">
  <div class="modal-box">
    <h3>Coming Soon</h3>
    <button class="btn" onclick="closeModal()">Close</button>
  </div>
</div>

<footer>© 2026 PHANTOMS — Built on Base</footer>

<script>
/* INTRO */
let p=0;
const bar=document.querySelector(".loading-bar");
const lp=document.getElementById("lp");
const intro=document.getElementById("intro");
const t=setInterval(()=>{
  p+=4;
  if(p>=100){
    clearInterval(t);
    setTimeout(()=>{intro.classList.add("hide");setTimeout(()=>intro.remove(),600)},400);
  }
  bar.style.width=p+"%";lp.textContent=p+"%";
},60);

/* MATRIX */
const c=document.getElementById("codebg");
const ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();addEventListener("resize",resize);
const chars="01{}[]<>$#";
let drops=Array(200).fill(1);
setInterval(()=>{
  ctx.fillStyle="rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="rgba(122,252,255,0.25)";
  ctx.font="14px monospace";
  for(let i=0;i<drops.length;i++){
    const t=chars[Math.random()*chars.length|0];
    ctx.fillText(t,i*10,drops[i]*10);
    if(drops[i]*10>c.height||Math.random()>.98)drops[i]=0;
    drops[i]++;
  }
},50);

/* UI */
function toggle(id){
  const e=document.getElementById(id);
  e.style.display=e.style.display==="block"?"none":"block";
  e.classList.add("reveal");
}
function openModal(){document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}

  /* ===== FIXED INFINITE GALLERY (NO SHUFFLE) ===== */

const g = document.getElementById("gallery");

/* 21 NFTs total */
const NFTs = [
  "assets/nft1.png","assets/nft2.png","assets/nft3.png",
  "assets/nft4.png","assets/nft5.png","assets/nft6.png","assets/nft7.png",
  "assets/nft8.png","assets/nft9.png","assets/nft10.png",
  "assets/nft11.png","assets/nft12.png","assets/nft13.png","assets/nft14.png",
  "assets/nft15.png","assets/nft16.png","assets/nft17.png","assets/nft18.png",
  "assets/nft19.png","assets/nft20.png","assets/nft21.png"
];

/* split into 3 rows, 7 each */
for(let r=0; r<3; r++){
  const row = document.createElement("div");
  row.className = "track row"+(r+1);

  const rowNFTs = NFTs.slice(r*7, r*7 + 7);
  const loopNFTs = [...rowNFTs, ...rowNFTs]; // duplicate for infinite loop

  loopNFTs.forEach(src=>{
    const img = document.createElement("img");
    img.src = src;
    img.onclick = openModal;
    row.appendChild(img);
  });

  g.appendChild(row);
}

/* WHITELIST: GDT + FCFS */
let GDT=[],FCFS=[],readyGDT=false,readyFCFS=false;
fetch("data/gdt.csv").then(r=>r.text()).then(t=>{
  GDT=t.split(/\r?\n/).map(x=>x.replace(/\uFEFF/g,"").trim().toLowerCase()).filter(Boolean);
  readyGDT=true;
});
fetch("data/fcfs.csv").then(r=>r.text()).then(t=>{
  FCFS=t.split(/\r?\n/).map(x=>x.replace(/\uFEFF/g,"").trim().toLowerCase()).filter(Boolean);
  readyFCFS=true;
});

function checkWallet(){
  const v=document.getElementById("walletInput").value.trim().toLowerCase();
  const s=document.getElementById("walletStatus");
  if(!v){s.textContent="❌ Enter wallet address";s.className="status-no";return;}
  if(!readyGDT||!readyFCFS){s.textContent="⏳ Loading whitelist…";s.className="status-no";return;}
  if(GDT.includes(v)){s.textContent="✅ GDT Whitelisted";s.className="status-ok";}
  else if(FCFS.includes(v)){s.textContent="✅ FCFS Whitelisted";s.className="status-ok";}
  else{s.textContent="❌ Not Whitelisted";s.className="status-no";}
}
  function toggleExplore(){
  const explore = document.getElementById("explore");
  const about = document.getElementById("about");

  const isOpen = explore.style.display === "block";

  explore.style.display = isOpen ? "none" : "block";
  about.style.display = isOpen ? "none" : "block";

  explore.classList.add("reveal");
  about.classList.add("reveal");
}

</script>

</body>
</html>
