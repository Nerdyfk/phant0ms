<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <title>PHANTOMS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- XLSX -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: "#0B0F1A",
            neonBlue: "#5B8CFF",
            neonPurple: "#8A5CFF",
            neonGreen: "#3CFF8F",
            neonRed: "#FF4D4D",
            neonGold: "#FFD36A",
          },
        },
      },
    };
  </script>

  <style>
    body { overflow-x: hidden; }

    .float {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
      100% { transform: translateY(0); }
    }

    .parallax {
      position: absolute;
      pointer-events: none;
      transition: transform 0.15s ease-out;
    }

    .line {
      position: absolute;
      width: 2px;
      height: 120px;
      background: linear-gradient(to bottom, transparent, #5B8CFF, transparent);
      animation: lines 4s linear infinite;
      opacity: 0.3;
    }
    @keyframes lines {
      from { transform: translateY(-150px); }
      to { transform: translateY(100vh); }
    }

    @keyframes glow {
      0% { box-shadow: 0 0 0 transparent; }
      50% { box-shadow: 0 0 25px currentColor; }
      100% { box-shadow: 0 0 0 transparent; }
    }
    .result-glow {
      animation: glow 1.6s ease-in-out infinite;
    }
  </style>
</head>

<body class="bg-white dark:bg-bgDark text-black dark:text-white transition-colors duration-500">

<!-- NAVBAR -->
<header class="fixed top-0 left-0 w-full z-50 px-6 py-4 flex justify-between items-center">
  <img src="assets/logo.png" class="w-8 md:w-10 opacity-80 hover:scale-110 transition" />
  <button id="themeToggle" class="w-12 h-6 rounded-full bg-gray-300 dark:bg-gray-700 relative">
    <span id="toggleDot" class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full transition"></span>
  </button>
</header>

<!-- HERO -->
<section class="relative min-h-screen flex flex-col justify-center items-center text-center pt-32">

  <!-- NFTs LEFT -->
  <div class="absolute left-6 top-1/2 -translate-y-1/2 space-y-6">
    <img src="assets/nft1.png" class="w-24 float">
    <img src="assets/nft2.png" class="w-24 float">
    <img src="assets/nft3.png" class="w-24 float">
    <img src="assets/nft4.png" class="w-24 float">
  </div>

  <!-- NFTs RIGHT -->
  <div class="absolute right-6 top-1/2 -translate-y-1/2 space-y-6">
    <img src="assets/nft5.png" class="w-24 float">
    <img src="assets/nft6.png" class="w-24 float">
    <img src="assets/nft7.png" class="w-24 float">
    <img src="assets/nft8.png" class="w-24 float">
  </div>

  <h1 class="text-6xl md:text-8xl font-extrabold mb-4">PHANTOMS</h1>
  <p class="text-gray-500 dark:text-gray-400 max-w-xl">
    A pixel-born civilization on Base
  </p>
</section>

<!-- ABOUT -->
<section class="py-32 px-6 max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">
  <div>
    <h2 class="text-4xl font-bold mb-6">ABOUT US</h2>
    <p class="text-gray-600 dark:text-gray-300 mb-6">
      Born from scattered pixels, PHANTOMS is an emerging civilization on Base.
    </p>
    <p class="text-gray-600 dark:text-gray-300">
      Built by citizens, powered by lore, forging an on-chain society.
    </p>
  </div>
  <div class="grid grid-cols-2 gap-6">
    <img src="assets/nft1.png" class="rounded-xl">
    <img src="assets/nft2.png" class="rounded-xl">
    <img src="assets/nft3.png" class="rounded-xl">
    <img src="assets/nft4.png" class="rounded-xl">
  </div>
</section>

<!-- SNEAKPEEKS -->
<section class="relative min-h-screen overflow-hidden py-32 text-center">
  <h2 class="text-4xl font-bold mb-12">PHANTOMS SNEAKPEEKS</h2>

  <!-- animated lines -->
  <div class="line" style="left:20%"></div>
  <div class="line" style="left:50%"></div>
  <div class="line" style="left:80%"></div>

  <img src="assets/nft5.png" class="parallax w-32 left-1/4 top-1/3" data-speed="2">
  <img src="assets/nft6.png" class="parallax w-32 right-1/4 top-1/2" data-speed="4">
</section>

<!-- WALLET CHECKER -->
<section class="py-32 flex justify-center">
  <div class="w-full max-w-md p-6 rounded-2xl bg-white/10 border border-white/20">
    <h3 class="text-2xl font-bold mb-4 text-center">Wallet Checker</h3>
    <input id="walletInput" class="w-full px-4 py-3 rounded-xl bg-black/40 border mb-4" placeholder="Paste wallet (0x...)">
    <button onclick="checkWallet()" class="w-full py-3 rounded-xl bg-gradient-to-r from-neonBlue to-neonPurple">
      Check Status
    </button>
    <div id="result" class="hidden mt-6 p-4 rounded-xl text-center font-semibold result-glow"></div>
  </div>
</section>

<!-- FOOTER -->
<footer class="py-12 flex justify-center gap-6">
  <a class="px-6 py-3 rounded-xl bg-blue-500 text-white">Twitter</a>
  <a class="px-6 py-3 rounded-xl bg-gray-800 text-white">OpenSea</a>
</footer>

<script>
/* DARK MODE */
const toggle = document.getElementById("themeToggle");
const dot = document.getElementById("toggleDot");
toggle.onclick = () => {
  document.documentElement.classList.toggle("dark");
  dot.classList.toggle("translate-x-6");
};

/* PARALLAX */
document.addEventListener("mousemove", e => {
  document.querySelectorAll(".parallax").forEach(el => {
    const s = el.dataset.speed;
    el.style.transform =
      `translate(${(window.innerWidth/2-e.clientX)/40*s}px,
                 ${(window.innerHeight/2-e.clientY)/40*s}px)`;
  });
});

/* WALLET */
let whitelist = {};
fetch("data/whitelist.csv").then(r=>r.text()).then(t=>{
  t.split("\n").slice(1).forEach(r=>{
    const [w,s]=r.split(",");
    if(w) whitelist[w.trim().toLowerCase()]=s.trim().toLowerCase();
  });
});

function checkWallet(){
  const w = walletInput.value.trim().toLowerCase();
  const r = result;
  r.classList.remove("hidden");
  if(whitelist[w]==="whitelisted"){
    r.textContent="✅ WHITELISTED";
    r.style.color="#3CFF8F";
  }else{
    r.textContent="❌ NOT WHITELISTED";
    r.style.color="#FF4D4D";
  }
}
</script>

</body>
</html>
