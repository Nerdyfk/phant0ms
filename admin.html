<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHANTOMS - Admin Panel</title>

<style>
:root{--c1:#7afcff;--c2:#ff7adf}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,sans-serif;
  color:#fff;
  overflow-x:hidden;
  background:linear-gradient(120deg,#12001c,#2a003c,#120020);
  background-size:400% 400%;
  animation:bg 20s ease infinite;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.container{
  width:100%;
  max-width:700px;
  background:rgba(13,18,36,0.9);
  border:1px solid rgba(105,130,255,0.25);
  border-radius:16px;
  padding:32px;
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

.logo{
  text-align:center;
  margin-bottom:24px;
}

.logo h1{
  font-size:32px;
  background:linear-gradient(90deg,var(--c1),var(--c2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin:0;
}

.logo p{
  color:#9eb5ff;
  font-size:14px;
  margin:8px 0 0 0;
}

.login-box{
  display:block;
}

.admin-content{
  display:none;
}

input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid rgba(105,130,255,0.4);
  background:rgba(13,18,36,0.7);
  color:#e0e7ff;
  margin-bottom:12px;
  font-size:14px;
}

input:focus{
  outline:none;
  border-color:var(--c1);
}

.btn{
  width:100%;
  border:none;
  border-radius:8px;
  padding:14px;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(120deg,#FFD36A,#FF8A00);
  color:#0d1224;
  font-size:16px;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(255,211,106,0.4);
}

.btn-secondary{
  background:linear-gradient(120deg,#5B8CFF,#8A5CFF);
  color:#fff;
  margin-top:8px;
}

.btn-danger{
  background:linear-gradient(120deg,#FF6B6B,#FF4444);
  color:#fff;
}

.btn-success{
  background:linear-gradient(120deg,#3CFF8F,#00FF9F);
  color:#000;
}

.error{
  text-align:center;
  margin-top:12px;
  color:#ff9b9b;
  display:none;
  font-weight:600;
  font-size:14px;
}

.section{
  margin-top:24px;
  padding-top:24px;
  border-top:1px solid rgba(255,255,255,0.18);
}

.section h3{
  margin:0 0 16px 0;
  font-size:18px;
  color:#e0e7ff;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:12px;
  max-height:300px;
  overflow-y:auto;
}

.list-item{
  padding:12px;
  border-radius:8px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.18);
  font-size:14px;
}

.list-item strong{
  color:#e0e7ff;
}

.list-item p{
  margin:4px 0;
  color:#9fb2ff;
  font-size:13px;
}

.stats-box{
  padding:16px;
  background:rgba(255,255,255,0.05);
  border-radius:8px;
  font-size:14px;
  color:#b7c5ff;
}

.stats-box p{
  margin:6px 0;
}

.winner-display{
  margin-top:12px;
  padding:12px;
  border-radius:8px;
  background:rgba(255,211,106,0.15);
  border:1px solid rgba(255,211,106,0.35);
  display:none;
  text-align:center;
}

.winner-display p:first-child{
  font-size:12px;
  color:#b7c5ff;
  margin-bottom:4px;
}

.winner-display p:last-child{
  font-size:16px;
  font-weight:700;
  color:#FFD36A;
  margin:0;
}

.btn-group{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.btn-small{
  padding:6px 10px;
  font-size:12px;
  background:rgba(255,77,77,0.3);
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition:.2s;
}

.btn-small:hover{
  background:rgba(255,77,77,0.5);
}

.logout-btn{
  position:absolute;
  top:16px;
  right:16px;
  background:rgba(255,77,77,0.3);
  color:#fff;
  border:none;
  padding:8px 16px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
}

.logout-btn:hover{
  background:rgba(255,77,77,0.5);
}

a{
  color:#7afcff;
  text-decoration:none;
  font-size:12px;
}

a:hover{
  text-decoration:underline;
}

@media(max-width:600px){
  .container{padding:20px;}
  .btn-group{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <h1>PHANTOMS</h1>
    <p>Admin Control Panel</p>
  </div>

  <!-- Login Form -->
  <div id="loginBox" class="login-box">
    <input id="adminEmail" type="email" placeholder="Admin Email" autocomplete="email">
    <input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" onclick="login()">Login</button>
    <div id="loginError" class="error"></div>
    <div style="text-align:center;margin-top:16px">
      <a href="/">← Back to Home</a>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminContent" class="admin-content">
    <button class="logout-btn" onclick="logout()">Logout</button>

    <!-- Manage Tasks -->
    <div class="section">
      <h3>🎯 Manage Giveaway Tasks</h3>
      <input id="newTaskInput" placeholder="Task name (e.g., Follow on X)">
      <input id="newTaskLink" placeholder="Task link (optional)">
      <button class="btn btn-success" onclick="addTask()">Add Task</button>
      <div id="tasksList" class="list" style="margin-top:12px"></div>
    </div>

    <!-- View Submissions -->
    <div class="section">
      <h3>📋 Submissions (<span id="entryCount">0</span>)</h3>
      <div id="submissionsList" class="list"></div>
    </div>

    <!-- Visitor Stats -->
    <div class="section">
      <h3>📊 Visitor Statistics</h3>
      <div id="visitorStats" class="stats-box"></div>
    </div>

    <!-- Manage Partnerships -->
    <div class="section">
      <h3>🤝 Manage Partnerships</h3>
      <input id="partnerTitle" placeholder="Partnership Title (e.g., Brand X)">
      <textarea id="partnerDesc" placeholder="Partnership Description" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(105,130,255,0.4);background:rgba(13,18,36,0.7);color:#e0e7ff;margin-bottom:12px;font-family:inherit;min-height:80px"></textarea>
      <input id="partnerTasks" placeholder="Tasks (comma-separated, e.g., Like Post, Share, Follow)">
      <button class="btn btn-success" onclick="addPartnership()" style="margin-top:8px">Add Partnership</button>
      <div id="partnershipsList" class="list" style="margin-top:12px"></div>
    </div>

    <!-- Actions -->
    <div class="section">
      <h3>🎲 Actions</h3>
      <button class="btn" onclick="drawWinner()" style="margin-top:8px">Draw Winner</button>
      <button class="btn btn-success" onclick="exportWinners()" style="margin-top:8px">📥 Export Winners CSV</button>
      <button class="btn btn-danger" onclick="resetGiveaway()" style="margin-top:8px">Reset Giveaway</button>
      <div id="winnerDisplay" class="winner-display">
        <p>🎉 Winner</p>
        <p id="winnerName"></p>
      </div>
    </div>
  </div>
</div>

<script>
let authToken = ''; // Store auth token after login
let partnershipData = JSON.parse(localStorage.getItem('partnershipData') || '{"partnerships":[]}');

// Load Dashboard
async function login() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value.trim();
  const errorBox = document.getElementById('loginError');
  const loginBtn = document.querySelector('.btn');

  // Disable button during login
  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in...';
  errorBox.style.display = 'none';

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (data.success) {
      // Store auth token as base64(email:password)
      authToken = btoa(email + ':' + password);
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      loadDashboard();
    } else {
      errorBox.textContent = '❌ ' + (data.message || 'Invalid credentials');
      errorBox.style.display = 'block';
    }
  } catch (error) {
    errorBox.textContent = '❌ Connection error. Please try again.';
    errorBox.style.display = 'block';
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Login';
  }
}

// Logout
function logout() {
  authToken = '';
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('adminContent').style.display = 'none';
  document.getElementById('adminEmail').value = '';
  document.getElementById('adminPassword').value = '';
  document.getElementById('loginError').style.display = 'none';
}

// Load Dashboard
function loadDashboard() {
  refreshTasks();
  refreshSubmissions();
  refreshVisitorStats();
  updateToggleButton();
}

// Tasks
async function addTask() {
  const name = document.getElementById('newTaskInput').value.trim();
  const link = document.getElementById('newTaskLink').value.trim();
  
  if (!name) {
    alert('Enter task name');
    return;
  }
  
  try {
    const response = await fetch('/api/giveaway/tasks', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({ label: name, url: link })
    });
    
    const data = await response.json();
    if (data.success) {
      refreshTasks();
      document.getElementById('newTaskInput').value = '';
      document.getElementById('newTaskLink').value = '';
    } else {
      alert('Failed to add task: ' + (data.message || 'Unknown error'));
    }
  } catch (e) {
    alert('Error adding task');
  }
}

async function removeTask(taskId) {
  if (!confirm('Delete this task?')) return;
  
  try {
    const response = await fetch('/api/giveaway/tasks', {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({ id: taskId })
    });
    
    const data = await response.json();
    if (data.success) {
      refreshTasks();
    } else {
      alert('Failed to delete task');
    }
  } catch (e) {
    alert('Error deleting task');
  }
}

async function refreshTasks() {
  const list = document.getElementById('tasksList');
  list.innerHTML = '<p style="text-align:center;opacity:0.5">Loading...</p>';
  
  try {
    const response = await fetch('/api/giveaway/tasks');
    const data = await response.json();
    
    list.innerHTML = '';
    
    if (data.success && data.tasks.length > 0) {
      data.tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = 'list-item';
        const linkHtml = task.url ? ` <a href="${task.url}" target="_blank">link</a>` : '';
        div.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span>${task.label}${linkHtml}</span>
            <button class="btn-small" onclick="removeTask(${task.id})">Remove</button>
          </div>
        `;
        list.appendChild(div);
      });
    } else {
      list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#9fb2ff">No tasks yet</p></div>';
    }
  } catch (e) {
    list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#ff9b9b">Error loading tasks</p></div>';
  }
}

// Submissions
async function refreshSubmissions() {
  const list = document.getElementById('submissionsList');
  const countEl = document.getElementById('entryCount');
  list.innerHTML = '<p style="text-align:center;opacity:0.5">Loading...</p>';
  
  try {
    const response = await fetch('/api/giveaway/entries', {
      headers: {
        'Authorization': 'Bearer ' + authToken
      }
    });
    const data = await response.json();
    
    list.innerHTML = '';
    
    if (data.success && data.entries.length > 0) {
      countEl.textContent = data.entries.length;
      
      data.entries.forEach(entry => {
        const div = document.createElement('div');
        div.className = 'list-item';
        const winnerBadge = entry.is_winner ? '<span style="color:#3CFF8F;font-weight:bold"> 🏆 WINNER</span>' : '';
        div.innerHTML = `
          <p><strong>${entry.twitter_handle}</strong>${winnerBadge}</p>
          <p>${entry.email}</p>
          <p style="color:#7afcff">${entry.wallet_address}</p>
          <p style="font-size:11px;opacity:0.6">${new Date(entry.created_at).toLocaleString()}</p>
        `;
        list.appendChild(div);
      });
    } else {
      countEl.textContent = '0';
      list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#9fb2ff">No entries yet</p></div>';
    }
  } catch (e) {
    list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#ff9b9b">Error loading entries</p></div>';
  }
}

// Visitor Stats
function refreshVisitorStats() {
  const data = JSON.parse(localStorage.getItem('visitorData') || '{}');
  const stats = document.getElementById('visitorStats');
  
  stats.innerHTML = `
    <p>📊 Current Period: <strong>${data.currentVisitors || 0}</strong> visitors</p>
    <p>📅 Daily Total: <strong>${data.dailyVisitors || 0}</strong> visitors</p>
    <p style="font-size:12px;opacity:0.7">Updates every 15 minutes</p>
  `;
}

// Partnership Functions
function addPartnership() {
  const title = document.getElementById('partnerTitle').value.trim();
  const desc = document.getElementById('partnerDesc').value.trim();
  const taskStr = document.getElementById('partnerTasks').value.trim();
  
  if (!title || !desc || !taskStr) {
    alert('Fill all partnership fields');
    return;
  }
  
  const tasks = taskStr.split(',').map(t => t.trim()).filter(Boolean);
  partnershipData.partnerships.push({ title, desc, tasks, date: new Date().toLocaleString() });
  
  document.getElementById('partnerTitle').value = '';
  document.getElementById('partnerDesc').value = '';
  document.getElementById('partnerTasks').value = '';
  
  localStorage.setItem('partnershipData', JSON.stringify(partnershipData));
  refreshPartnerships();
}

function removePartnership(idx) {
  partnershipData.partnerships.splice(idx, 1);
  localStorage.setItem('partnershipData', JSON.stringify(partnershipData));
  refreshPartnerships();
}

function refreshPartnerships() {
  const list = document.getElementById('partnershipsList');
  list.innerHTML = '';
  
  partnershipData.partnerships.forEach((partner, idx) => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
      <p><strong>${partner.title}</strong></p>
      <p style="color:#9fb2ff;font-size:13px">${partner.desc}</p>
      <p style="color:#7afcff;font-size:12px">${partner.tasks.join(', ')}</p>
      <button class="btn-small" onclick="removePartnership(${idx})" style="margin-top:6px">Delete</button>
    `;
    list.appendChild(div);
  });
  
  if (partnershipData.partnerships.length === 0) {
    list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#9fb2ff">No partnerships yet</p></div>';
  }
}

async function drawWinner() {
  try {
    const response = await fetch('/api/giveaway/winner', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + authToken
      }
    });
    
    const data = await response.json();
    
    if (data.success && data.winner) {
      const display = document.getElementById('winnerDisplay');
      document.getElementById('winnerName').textContent = `${data.winner.twitter_handle} — ${data.winner.email}`;
      display.style.display = 'block';
      refreshSubmissions();
    } else {
      alert(data.message || 'No entries yet!');
    }
  } catch (e) {
    alert('Error drawing winner');
  }
}

function resetGiveaway() {
  alert('⚠️ Contact developer to reset giveaway database');
}

async function exportWinners() {
  try {
    const response = await fetch('/api/giveaway/export-winners', {
      headers: {
        'Authorization': 'Bearer ' + authToken
      }
    });
    
    if (response.ok) {
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `giveaway_winners_${Date.now()}.csv`;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
    } else {
      const data = await response.json();
      alert('Export failed: ' + (data.message || 'Unknown error'));
    }
  } catch (e) {
    alert('Error exporting winners');
  }
}

// Load Dashboard
function loadDashboard() {
  refreshTasks();
  refreshSubmissions();
  refreshVisitorStats();
  refreshPartnerships();
}

// Auto-refresh visitor stats every 15 minutes
setInterval(refreshVisitorStats, 900000);

// Enter key to login
document.getElementById('adminPassword')?.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') login();
});
</script>

</body>
</html>
