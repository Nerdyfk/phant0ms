<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHANTOMS - Admin Panel</title>

<style>
:root{--c1:#7afcff;--c2:#ff7adf}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,sans-serif;
  color:#fff;
  overflow-x:hidden;
  background:linear-gradient(120deg,#12001c,#2a003c,#120020);
  background-size:400% 400%;
  animation:bg 20s ease infinite;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.container{
  width:100%;
  max-width:700px;
  background:rgba(13,18,36,0.9);
  border:1px solid rgba(105,130,255,0.25);
  border-radius:16px;
  padding:32px;
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

.logo{
  text-align:center;
  margin-bottom:24px;
}

.logo h1{
  font-size:32px;
  background:linear-gradient(90deg,var(--c1),var(--c2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin:0;
}

.logo p{
  color:#9eb5ff;
  font-size:14px;
  margin:8px 0 0 0;
}

.login-box{
  display:block;
}

.admin-content{
  display:none;
}

input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid rgba(105,130,255,0.4);
  background:rgba(13,18,36,0.7);
  color:#e0e7ff;
  margin-bottom:12px;
  font-size:14px;
}

input:focus{
  outline:none;
  border-color:var(--c1);
}

.btn{
  width:100%;
  border:none;
  border-radius:8px;
  padding:14px;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(120deg,#FFD36A,#FF8A00);
  color:#0d1224;
  font-size:16px;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(255,211,106,0.4);
}

.btn-secondary{
  background:linear-gradient(120deg,#5B8CFF,#8A5CFF);
  color:#fff;
  margin-top:8px;
}

.btn-danger{
  background:linear-gradient(120deg,#FF6B6B,#FF4444);
  color:#fff;
}

.btn-success{
  background:linear-gradient(120deg,#3CFF8F,#00FF9F);
  color:#000;
}

.error{
  text-align:center;
  margin-top:12px;
  color:#ff9b9b;
  display:none;
  font-weight:600;
  font-size:14px;
}

.section{
  margin-top:24px;
  padding-top:24px;
  border-top:1px solid rgba(255,255,255,0.18);
}

.section h3{
  margin:0 0 16px 0;
  font-size:18px;
  color:#e0e7ff;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:12px;
  max-height:300px;
  overflow-y:auto;
}

.list-item{
  padding:12px;
  border-radius:8px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.18);
  font-size:14px;
}

.list-item strong{
  color:#e0e7ff;
}

.list-item p{
  margin:4px 0;
  color:#9fb2ff;
  font-size:13px;
}

.stats-box{
  padding:16px;
  background:rgba(255,255,255,0.05);
  border-radius:8px;
  font-size:14px;
  color:#b7c5ff;
}

.stats-box p{
  margin:6px 0;
}

.winner-display{
  margin-top:12px;
  padding:12px;
  border-radius:8px;
  background:rgba(255,211,106,0.15);
  border:1px solid rgba(255,211,106,0.35);
  display:none;
  text-align:center;
}

.winner-display p:first-child{
  font-size:12px;
  color:#b7c5ff;
  margin-bottom:4px;
}

.winner-display p:last-child{
  font-size:16px;
  font-weight:700;
  color:#FFD36A;
  margin:0;
}

.btn-group{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.btn-small{
  padding:6px 10px;
  font-size:12px;
  background:rgba(255,77,77,0.3);
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition:.2s;
}

.btn-small:hover{
  background:rgba(255,77,77,0.5);
}

.logout-btn{
  position:absolute;
  top:16px;
  right:16px;
  background:rgba(255,77,77,0.3);
  color:#fff;
  border:none;
  padding:8px 16px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
}

.logout-btn:hover{
  background:rgba(255,77,77,0.5);
}

a{
  color:#7afcff;
  text-decoration:none;
  font-size:12px;
}

a:hover{
  text-decoration:underline;
}

@media(max-width:600px){
  .container{padding:20px;}
  .btn-group{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <h1>PHANTOMS</h1>
    <p>Admin Control Panel</p>
  </div>

  <!-- Login Form -->
  <div id="loginBox" class="login-box">
    <input id="adminEmail" type="email" placeholder="Admin Email" autocomplete="email">
    <input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" onclick="login()">Login</button>
    <div id="loginError" class="error"></div>
    <div style="text-align:center;margin-top:16px">
      <a href="/">← Back to Home</a>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminContent" class="admin-content">
    <button class="logout-btn" onclick="logout()">Logout</button>

    <!-- Manage Tasks -->
    <div class="section">
      <h3>🎯 Manage Giveaway Tasks</h3>
      <input id="newTaskInput" placeholder="Task name (e.g., Follow on X)">
      <input id="newTaskLink" placeholder="Task link (optional)">
      <button class="btn btn-success" onclick="addTask()">Add Task</button>
      <div id="tasksList" class="list" style="margin-top:12px"></div>
    </div>

    <!-- View Submissions -->
    <div class="section">
      <h3>📋 Submissions (<span id="entryCount">0</span>)</h3>
      <div id="submissionsList" class="list"></div>
    </div>

    <!-- Visitor Stats -->
    <div class="section">
      <h3>📊 Visitor Statistics</h3>
      <div id="visitorStats" class="stats-box"></div>
    </div>

    <!-- Actions -->
    <div class="section">
      <h3>🎲 Actions</h3>
      <button class="btn btn-secondary" id="toggleBtn" onclick="toggleGiveaway()">Toggle Giveaway</button>
      <button class="btn" onclick="drawWinner()" style="margin-top:8px">Draw Winner</button>
      <button class="btn btn-danger" onclick="resetGiveaway()" style="margin-top:8px">Reset Giveaway</button>
      <div id="winnerDisplay" class="winner-display">
        <p>🎉 Winner</p>
        <p id="winnerName"></p>
      </div>
    </div>
  </div>
</div>

<script>
let giveawayData = JSON.parse(localStorage.getItem('giveawayData') || '{"entries":[],"tasks":[],"active":false}');

// Login with Vercel API
async function login() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value.trim();
  const errorBox = document.getElementById('loginError');
  const loginBtn = document.querySelector('.btn');

  // Disable button during login
  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in...';
  errorBox.style.display = 'none';

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (data.success) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      loadDashboard();
    } else {
      errorBox.textContent = '❌ ' + (data.message || 'Invalid credentials');
      errorBox.style.display = 'block';
    }
  } catch (error) {
    errorBox.textContent = '❌ Connection error. Please try again.';
    errorBox.style.display = 'block';
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Login';
  }
}

// Logout
function logout() {
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('adminContent').style.display = 'none';
  document.getElementById('adminEmail').value = '';
  document.getElementById('adminPassword').value = '';
  document.getElementById('loginError').style.display = 'none';
}

// Load Dashboard
function loadDashboard() {
  refreshTasks();
  refreshSubmissions();
  refreshVisitorStats();
  updateToggleButton();
}

// Tasks
function addTask() {
  const name = document.getElementById('newTaskInput').value.trim();
  const link = document.getElementById('newTaskLink').value.trim();
  
  if (!name) {
    alert('Enter task name');
    return;
  }
  
  giveawayData.tasks.push({ label: name, url: link });
  saveData();
  refreshTasks();
  
  document.getElementById('newTaskInput').value = '';
  document.getElementById('newTaskLink').value = '';
}

function removeTask(idx) {
  giveawayData.tasks.splice(idx, 1);
  saveData();
  refreshTasks();
}

function refreshTasks() {
  const list = document.getElementById('tasksList');
  list.innerHTML = '';
  
  giveawayData.tasks.forEach((task, idx) => {
    const div = document.createElement('div');
    div.className = 'list-item';
    const linkHtml = task.url ? ` <a href="${task.url}" target="_blank">link</a>` : '';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span>${task.label}${linkHtml}</span>
        <button class="btn-small" onclick="removeTask(${idx})">Remove</button>
      </div>
    `;
    list.appendChild(div);
  });
}

// Submissions
function refreshSubmissions() {
  const list = document.getElementById('submissionsList');
  list.innerHTML = '';
  
  document.getElementById('entryCount').textContent = giveawayData.entries.length;
  
  giveawayData.entries.forEach((entry, idx) => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
      <p><strong>${entry.twitter}</strong></p>
      <p>${entry.email}</p>
      <p style="color:#7afcff">${entry.wallet}</p>
      <button class="btn-small" onclick="removeEntry(${idx})" style="margin-top:6px">Delete</button>
    `;
    list.appendChild(div);
  });
  
  if (giveawayData.entries.length === 0) {
    list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#9fb2ff">No entries yet</p></div>';
  }
}

function removeEntry(idx) {
  giveawayData.entries.splice(idx, 1);
  saveData();
  refreshSubmissions();
}

// Visitor Stats
function refreshVisitorStats() {
  const data = JSON.parse(localStorage.getItem('visitorData') || '{}');
  const stats = document.getElementById('visitorStats');
  
  stats.innerHTML = `
    <p>📊 Current Period: <strong>${data.currentVisitors || 0}</strong> visitors</p>
    <p>📅 Daily Total: <strong>${data.dailyVisitors || 0}</strong> visitors</p>
    <p style="font-size:12px;opacity:0.7">Updates every 15 minutes</p>
  `;
}

// Giveaway Controls
function toggleGiveaway() {
  giveawayData.active = !giveawayData.active;
  saveData();
  updateToggleButton();
  alert(giveawayData.active ? '✅ Giveaway is now LIVE!' : '⏸️ Giveaway paused');
}

function updateToggleButton() {
  const btn = document.getElementById('toggleBtn');
  btn.textContent = giveawayData.active ? 'Pause Giveaway' : 'Start Giveaway';
}

function drawWinner() {
  if (giveawayData.entries.length === 0) {
    alert('No entries yet!');
    return;
  }
  
  const winner = giveawayData.entries[Math.floor(Math.random() * giveawayData.entries.length)];
  const display = document.getElementById('winnerDisplay');
  
  document.getElementById('winnerName').textContent = `${winner.twitter} — ${winner.email}`;
  display.style.display = 'block';
}

function resetGiveaway() {
  if (confirm('⚠️ Reset giveaway? This will clear all entries.')) {
    giveawayData.entries = [];
    saveData();
    refreshSubmissions();
    document.getElementById('winnerDisplay').style.display = 'none';
    alert('✅ Giveaway reset!');
  }
}

// Save to localStorage
function saveData() {
  localStorage.setItem('giveawayData', JSON.stringify(giveawayData));
}

// Auto-refresh visitor stats every 15 minutes
setInterval(refreshVisitorStats, 900000);

// Enter key to login
document.getElementById('adminPassword')?.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') login();
});
</script>

</body>
</html>
