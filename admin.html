<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHANTOMS - Admin Panel</title>

<style>
:root{--c1:#7afcff;--c2:#ff7adf}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,sans-serif;
  color:#fff;
  overflow-x:hidden;
  background:linear-gradient(120deg,#12001c,#2a003c,#120020);
  background-size:400% 400%;
  animation:bg 20s ease infinite;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.container{
  width:100%;
  max-width:700px;
  background:rgba(13,18,36,0.9);
  border:1px solid rgba(105,130,255,0.25);
  border-radius:16px;
  padding:32px;
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
  position:relative;
  max-height:90vh;
  overflow-y:auto;
}

.container::-webkit-scrollbar{
  width:8px;
}

.container::-webkit-scrollbar-track{
  background:rgba(13,18,36,0.5);
  border-radius:4px;
}

.container::-webkit-scrollbar-thumb{
  background:rgba(122,252,255,0.3);
  border-radius:4px;
}

.container::-webkit-scrollbar-thumb:hover{
  background:rgba(122,252,255,0.5);
}

.logo{
  text-align:center;
  margin-bottom:24px;
}

.logo h1{
  font-size:32px;
  background:linear-gradient(90deg,var(--c1),var(--c2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin:0;
}

.logo p{
  color:#9eb5ff;
  font-size:14px;
  margin:8px 0 0 0;
}

.login-box{
  display:block;
}

.admin-content{
  display:none;
}

input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid rgba(105,130,255,0.4);
  background:rgba(13,18,36,0.7);
  color:#e0e7ff;
  margin-bottom:12px;
  font-size:14px;
}

input:focus{
  outline:none;
  border-color:var(--c1);
  box-shadow:0 0 0 3px rgba(122,252,255,0.1);
}

select{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid rgba(105,130,255,0.4);
  background:rgba(13,18,36,0.7);
  color:#e0e7ff;
  font-size:14px;
  cursor:pointer;
  transition:.2s;
}

select:focus{
  outline:none;
  border-color:var(--c1);
  box-shadow:0 0 0 3px rgba(122,252,255,0.1);
}

select option{
  background:#0d1224;
  color:#e0e7ff;
  padding:8px;
}

textarea{
  font-family:inherit;
  resize:vertical;
}

textarea:focus{
  outline:none;
  border-color:var(--c1);
  box-shadow:0 0 0 3px rgba(122,252,255,0.1);
}

.btn{
  width:100%;
  border:none;
  border-radius:8px;
  padding:14px;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(120deg,#FFD36A,#FF8A00);
  color:#0d1224;
  font-size:16px;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(255,211,106,0.4);
}

.btn-secondary{
  background:linear-gradient(120deg,#5B8CFF,#8A5CFF);
  color:#fff;
  margin-top:8px;
}

.btn-danger{
  background:linear-gradient(120deg,#FF6B6B,#FF4444);
  color:#fff;
}

.btn-success{
  background:linear-gradient(120deg,#3CFF8F,#00FF9F);
  color:#000;
}

.error{
  text-align:center;
  margin-top:12px;
  color:#ff9b9b;
  display:none;
  font-weight:600;
  font-size:14px;
}

.section{
  margin-top:24px;
  padding-top:24px;
  border-top:1px solid rgba(255,255,255,0.18);
}

.section h3{
  margin:0 0 16px 0;
  font-size:18px;
  color:#e0e7ff;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:12px;
  max-height:300px;
  overflow-y:auto;
}

.list-item{
  padding:12px;
  border-radius:8px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.18);
  font-size:14px;
}

.list-item strong{
  color:#e0e7ff;
}
.list-item p{
  margin:4px 0;
  color:#9fb2ff;
  font-size:13px;
}

.stats-box{
  padding:16px;
  background:rgba(105,130,255,0.1);
  border:1px solid rgba(105,130,255,0.3);
  border-radius:8px;
  font-size:14px;
  color:#b7c5ff;
}

.stats-box p{
  margin:8px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stats-box strong{
  color:#7afcff;
  font-size:18px;
}

.winner-display{
  margin-top:12px;
  padding:16px;
  border-radius:8px;
  background:rgba(60,255,143,0.15);
  border:2px solid rgba(60,255,143,0.35);
  display:none;
  text-align:center;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%, 100%{border-color:rgba(60,255,143,0.35);}
  50%{border-color:rgba(60,255,143,0.7);}
}

.winner-display p:first-child{
  font-size:14px;
  color:#b7c5ff;
  margin-bottom:8px;
  font-weight:600;
}

.winner-display p:last-child{
  font-size:16px;
  font-weight:700;
  color:#3CFF8F;
  margin:0;
  word-break:break-all;
}

.btn-group{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.btn-small{
  padding:6px 10px;
  font-size:12px;
  background:rgba(255,77,77,0.3);
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition:.2s;
}

.btn-small:hover{
  background:rgba(255,77,77,0.5);
}

.logout-btn{
  position:absolute;
  top:16px;
  right:16px;
  background:rgba(255,77,77,0.3);
  color:#fff;
  border:none;
  padding:8px 16px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
}

.logout-btn:hover{
  background:rgba(255,77,77,0.5);
}

a{
  color:#7afcff;
  text-decoration:none;
  font-size:12px;
}

a:hover{
  text-decoration:underline;
}

.loading-spinner{
  display:inline-block;
  width:16px;
  height:16px;
  border:2px solid rgba(122,252,255,0.3);
  border-top-color:#7afcff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

.success-message{
  padding:12px;
  background:rgba(60,255,143,0.15);
  border:1px solid rgba(60,255,143,0.4);
  border-radius:8px;
  color:#3CFF8F;
  text-align:center;
  margin-top:12px;
  animation:fadeIn 0.3s;
}

.error-message{
  padding:12px;
  background:rgba(255,77,77,0.15);
  border:1px solid rgba(255,77,77,0.4);
  border-radius:8px;
  color:#ff9b9b;
  text-align:center;
  margin-top:12px;
  animation:fadeIn 0.3s;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(-10px);}
  to{opacity:1;transform:translateY(0);}
}

@media(max-width:600px){
  .container{padding:20px;}
  .btn-group{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <h1>PHANTOMS</h1>
    <p>Admin Control Panel</p>
  </div>

  <!-- Login Form -->
  <div id="loginBox" class="login-box">
    <input id="adminEmail" type="email" placeholder="Admin Email" autocomplete="email">
    <input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" onclick="login()">Login</button>
    <div id="loginError" class="error"></div>
    <div style="text-align:center;margin-top:16px">
      <a href="/">← Back to Home</a>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminContent" class="admin-content">
    <button class="logout-btn" onclick="logout()">Logout</button>

    <!-- Manage Giveaways -->
    <div class="section">
      <h3>🎁 Manage Giveaways</h3>
      <input id="giveawayTitle" placeholder="Giveaway Title" style="margin-bottom:12px">
      <textarea id="giveawayDesc" placeholder="Giveaway Description" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(105,130,255,0.4);background:rgba(13,18,36,0.7);color:#e0e7ff;margin-bottom:12px;font-family:inherit;min-height:80px;box-sizing:border-box"></textarea>
      
      <label style="display:block;margin-bottom:8px;font-weight:600;color:#b7c5ff">Start Time</label>
      <input id="giveawayStart" type="datetime-local" style="margin-bottom:12px">
      <label style="display:block;margin-bottom:8px;font-weight:600;color:#b7c5ff">End Time</label>
      <input id="giveawayEnd" type="datetime-local" style="margin-bottom:12px">
      
      <label style="display:block;margin-bottom:8px;font-weight:600;color:#b7c5ff">Number of Winners</label>
      <input id="giveawayWinnerCount" type="number" min="1" value="1" placeholder="Number of Winners" style="margin-bottom:12px">
      
      <label style="display:block;margin-bottom:8px;font-weight:600;color:#b7c5ff">Prizes (one per line)</label>
      <textarea id="giveawayPrizes" placeholder="Prize 1: Description&#10;Prize 2: Description&#10;Prize 3: Description" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(105,130,255,0.4);background:rgba(13,18,36,0.7);color:#e0e7ff;margin-bottom:12px;font-family:inherit;min-height:80px;box-sizing:border-box"></textarea>
      
      <label style="display:block;margin-bottom:8px;font-weight:600;color:#b7c5ff">Status</label>
      <select id="giveawayStatus" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(105,130,255,0.4);background:rgba(13,18,36,0.7);color:#e0e7ff;margin-bottom:12px;box-sizing:border-box">
        <option value="draft">Draft</option>
        <option value="scheduled">Scheduled</option>
        <option value="live">Live</option>
        <option value="ended">Ended</option>
      </select>
      <button class="btn btn-success" onclick="createGiveaway()">Create Giveaway</button>
      <div id="giveawaysList" class="list" style="margin-top:12px"></div>
    </div>

    <!-- Manage Tasks -->
    <div class="section">
      <h3>🎯 Manage Giveaway Tasks</h3>
      <select id="giveawayTaskSelect" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(105,130,255,0.4);background:rgba(13,18,36,0.7);color:#e0e7ff;margin-bottom:12px;box-sizing:border-box">
        <option value="">-- Select Giveaway --</option>
      </select>
      <input id="newTaskInput" placeholder="Task name (e.g., Follow on X)">
      <input id="newTaskLink" placeholder="Task link (optional)">
      <label style="display:flex;align-items:center;margin:12px 0;cursor:pointer">
        <input id="newTaskRequired" type="checkbox" style="width:auto;margin-right:8px">
        <span style="color:#b7c5ff">Mark as Required Task</span>
      </label>
      <button class="btn btn-success" onclick="addTask()">Add Task</button>
      <div id="tasksList" class="list" style="margin-top:12px"></div>
    </div>

    <!-- View Submissions -->
    <div class="section">
      <h3>📋 Submissions (<span id="entryCount">0</span>)</h3>
      <select id="submissionsGiveawayFilter" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(105,130,255,0.4);background:rgba(13,18,36,0.7);color:#e0e7ff;margin-bottom:12px;box-sizing:border-box" onchange="refreshSubmissions()">
        <option value="">All Submissions</option>
      </select>
      <div id="submissionsList" class="list"></div>
    </div>

    <!-- Visitor Stats -->
    <div class="section">
      <h3>📊 Visitor Statistics</h3>
      <div id="visitorStats" class="stats-box"></div>
    </div>

    <!-- Manage Partnerships -->
    <div class="section">
      <h3>🤝 Manage Partnerships</h3>
      <input id="partnerTitle" placeholder="Partnership Title (e.g., Brand X)">
      <textarea id="partnerDesc" placeholder="Partnership Description" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(105,130,255,0.4);background:rgba(13,18,36,0.7);color:#e0e7ff;margin-bottom:12px;font-family:inherit;min-height:80px;box-sizing:border-box"></textarea>
      <input id="partnerTasks" placeholder="Tasks (comma-separated, e.g., Like Post, Share, Follow)">
      <button class="btn btn-success" onclick="addPartnership()" style="margin-top:8px">Add Partnership</button>
      <div id="partnershipsList" class="list" style="margin-top:12px"></div>
    </div>

    <!-- Actions -->
    <div class="section">
      <h3>🎲 Actions</h3>
      <div style="margin-bottom:16px;padding:12px;background:rgba(105,130,255,0.1);border:1px solid rgba(105,130,255,0.3);border-radius:8px">
        <p style="color:#b7c5ff;font-size:13px;margin:4px 0">Selected Giveaway: <strong id="selectedGiveawayDisplay">None</strong></p>
        <p style="color:#b7c5ff;font-size:13px;margin:4px 0">Status: <strong id="selectedGiveawayStatus">-</strong></p>
        <p style="color:#7afcff;font-size:14px;margin:8px 0;font-weight:600" id="giveawayTimer">⏱️ Select a giveaway</p>
      </div>
      
      <div class="btn-group" style="margin-bottom:12px">
        <button class="btn btn-success" onclick="startGiveaway()" id="startGiveawayBtn" disabled>▶️ Start Giveaway</button>
        <button class="btn btn-danger" onclick="endGiveaway()" id="endGiveawayBtn" disabled>⏹️ End Giveaway</button>
      </div>
      
      <button class="btn" onclick="drawWinners()" id="drawWinnersBtn" disabled style="margin-top:8px">🎲 Draw Winners</button>
      <button class="btn btn-success" onclick="exportWinners()" style="margin-top:8px">📥 Export Winners CSV</button>
      <div id="winnersDisplay" class="winner-display">
        <p>🎉 Winners</p>
        <div id="winnersList"></div>
      </div>
    </div>
  </div>
</div>

<script>
let authToken = ''; // Store auth token after login
let partnershipData = JSON.parse(localStorage.getItem('partnershipData') || '{"partnerships":[]}');
let giveaways = [];
let currentGiveawayId = null;

// Load Dashboard
async function login() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value.trim();
  const errorBox = document.getElementById('loginError');
  const loginBtn = document.querySelector('.btn');

  // Disable button during login
  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in...';
  errorBox.style.display = 'none';

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (data.success) {
      // Store auth token as base64(email:password)
      authToken = btoa(email + ':' + password);
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      loadDashboard();
    } else {
      errorBox.textContent = '❌ ' + (data.message || 'Invalid credentials');
      errorBox.style.display = 'block';
    }
  } catch (error) {
    errorBox.textContent = '❌ Connection error. Please try again.';
    errorBox.style.display = 'block';
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Login';
  }
}

// Logout
function logout() {
  authToken = '';
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('adminContent').style.display = 'none';
  document.getElementById('adminEmail').value = '';
  document.getElementById('adminPassword').value = '';
  document.getElementById('loginError').style.display = 'none';
}

// Load Dashboard
function loadDashboard() {
  refreshGiveaways();
  refreshTasks();
  refreshSubmissions();
  refreshVisitorStats();
  refreshPartnerships();
}

// ===== GIVEAWAY MANAGEMENT =====
async function createGiveaway() {
  const title = document.getElementById('giveawayTitle').value.trim();
  const desc = document.getElementById('giveawayDesc').value.trim();
  const startTime = document.getElementById('giveawayStart').value;
  const endTime = document.getElementById('giveawayEnd').value;
  const status = document.getElementById('giveawayStatus').value;
  const winnerCount = parseInt(document.getElementById('giveawayWinnerCount').value) || 1;
  const prizesText = document.getElementById('giveawayPrizes').value.trim();

  if (!title || !startTime || !endTime) {
    alert('Fill all required fields (Title, Start Time, End Time)');
    return;
  }

  // Parse prizes from textarea
  const prizes = prizesText ? prizesText.split('\n').filter(p => p.trim()).map(p => {
    const parts = p.split(':');
    return {
      name: parts[0]?.trim() || 'Prize',
      description: parts[1]?.trim() || parts[0]?.trim() || ''
    };
  }) : [];

  try {
    const response = await fetch('/api/giveaway/giveaways', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({
        title,
        description: desc,
        start_time: new Date(startTime).toISOString(),
        end_time: new Date(endTime).toISOString(),
        status,
        winner_count: winnerCount,
        prizes: prizes.length > 0 ? prizes : null
      })
    });

    const data = await response.json();
    if (data.success) {
      alert('Giveaway created successfully!');
      refreshGiveaways();
      document.getElementById('giveawayTitle').value = '';
      document.getElementById('giveawayDesc').value = '';
      document.getElementById('giveawayStart').value = '';
      document.getElementById('giveawayEnd').value = '';
      document.getElementById('giveawayWinnerCount').value = '1';
      document.getElementById('giveawayPrizes').value = '';
    } else {
      alert('Failed: ' + (data.message || 'Unknown error'));
    }
  } catch (e) {
    alert('Error creating giveaway');
    console.error(e);
  }
}

async function refreshGiveaways() {
  const list = document.getElementById('giveawaysList');
  const select = document.getElementById('giveawayTaskSelect');
  list.innerHTML = '<p style="text-align:center;opacity:0.5">Loading...</p>';
  
  try {
    const response = await fetch('/api/giveaway/giveaways', {
      headers: {
        'Authorization': 'Bearer ' + authToken
      }
    });
    const data = await response.json();
    
    list.innerHTML = '';
    select.innerHTML = '<option value="">-- Select Giveaway --</option>';

    if (data.success && data.giveaways.length > 0) {
      giveaways = data.giveaways;
      data.giveaways.forEach(g => {
        const option = document.createElement('option');
        option.value = g.id;
        option.textContent = `${g.title} (${g.status})`;
        select.appendChild(option);

        const div = document.createElement('div');
        div.className = 'list-item';
        const statusColor = g.status === 'live' ? '#7afcff' : g.status === 'ended' ? '#ff8a8a' : g.status === 'scheduled' ? '#FFD36A' : '#b7c5ff';
        const prizesHtml = g.prizes && g.prizes.length > 0 ? `<p style="color:#3CFF8F;font-size:12px">🏆 ${g.prizes.length} Prize(s) | 🎯 ${g.winner_count || 1} Winner(s)</p>` : `<p style="color:#9fb2ff;font-size:12px">🎯 ${g.winner_count || 1} Winner(s)</p>`;
        div.innerHTML = `
          <p><strong>${g.title}</strong> <span style="color:${statusColor};">[${g.status.toUpperCase()}]</span></p>
          <p style="color:#9fb2ff;font-size:13px">${g.description || 'No description'}</p>
          ${prizesHtml}
          <p style="font-size:11px;opacity:0.6">Start: ${new Date(g.start_time).toLocaleString()}</p>
          <p style="font-size:11px;opacity:0.6">End: ${new Date(g.end_time).toLocaleString()}</p>
          <button class="btn-small" onclick="editGiveawayDesc(${g.id})" style="margin-top:6px;background:rgba(122,252,255,0.3)">Edit Description</button>
          <button class="btn-small" onclick="deleteGiveaway(${g.id})" style="margin-top:6px">Delete</button>
        `;
        list.appendChild(div);
      });
    } else {
      list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#9fb2ff">No giveaways yet</p></div>';
    }
  } catch (e) {
    list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#ff9b9b">Error loading giveaways</p></div>';
    console.error(e);
  }
}

async function deleteGiveaway(giveawayId) {
  if (!confirm('Delete this giveaway?')) return;
  
  try {
    const response = await fetch('/api/giveaway/giveaways', {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({ id: giveawayId })
    });
    
    const data = await response.json();
    if (data.success) {
      refreshGiveaways();
      refreshTasks();
    } else {
      alert('Failed to delete giveaway');
    }
  } catch (e) {
    alert('Error deleting giveaway');
  }
}

// ===== TASKS MANAGEMENT =====
async function addTask() {
  const name = document.getElementById('newTaskInput').value.trim();
  const link = document.getElementById('newTaskLink').value.trim();
  const isRequired = document.getElementById('newTaskRequired').checked;
  const giveawayId = document.getElementById('giveawayTaskSelect').value;

  if (!name) {
    alert('Enter task name');
    return;
  }

  if (!giveawayId) {
    alert('Select a giveaway first');
    return;
  }

  try {
    const response = await fetch('/api/giveaway/tasks', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({
        giveaway_id: parseInt(giveawayId),
        label: name,
        url: link || null,
        is_required: isRequired
      })
    });
    
    const data = await response.json();
    if (data.success) {
      refreshTasks();
      document.getElementById('newTaskInput').value = '';
      document.getElementById('newTaskLink').value = '';
      document.getElementById('newTaskRequired').checked = false;
    } else {
      alert('Failed to add task: ' + (data.message || 'Unknown error'));
    }
  } catch (e) {
    alert('Error adding task');
    console.error(e);
  }
}

async function removeTask(taskId) {
  if (!confirm('Delete this task?')) return;
  
  try {
    const response = await fetch('/api/giveaway/tasks', {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({ id: taskId })
    });
    
    const data = await response.json();
    if (data.success) {
      refreshTasks();
    } else {
      alert('Failed to delete task');
    }
  } catch (e) {
    alert('Error deleting task');
  }
}

async function refreshTasks() {
  const list = document.getElementById('tasksList');
  const giveawayId = document.getElementById('giveawayTaskSelect').value;
  
  if (!giveawayId) {
    list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#9fb2ff">Select a giveaway to view tasks</p></div>';
    return;
  }

  list.innerHTML = '<p style="text-align:center;opacity:0.5">Loading...</p>';
  
  try {
    const response = await fetch(`/api/giveaway/tasks?giveaway_id=${giveawayId}`);
    const data = await response.json();
    
    list.innerHTML = '';
    
    if (data.success && data.tasks.length > 0) {
      data.tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = 'list-item';
        const linkHtml = task.url ? ` <a href="${task.url}" target="_blank">link</a>` : '';
        const requiredBadge = task.is_required ? '<span style="color:#FFD36A;margin-left:8px">⭐ Required</span>' : '<span style="color:#9fb2ff;margin-left:8px">Optional</span>';
        div.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span>${task.label}${linkHtml}${requiredBadge}</span>
            <button class="btn-small" onclick="removeTask(${task.id})">Remove</button>
          </div>
        `;
        list.appendChild(div);
      });
    } else {
      list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#9fb2ff">No tasks for this giveaway</p></div>';
    }
  } catch (e) {
    list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#ff9b9b">Error loading tasks</p></div>';
    console.error(e);
  }
}

// Submissions
async function refreshSubmissions() {
  const list = document.getElementById('submissionsList');
  const countEl = document.getElementById('entryCount');
  const filterSelect = document.getElementById('submissionsGiveawayFilter');
  const selectedGiveaway = filterSelect?.value || '';
  
  // Populate filter dropdown with giveaways if not already done
  if (filterSelect && giveaways.length > 0 && filterSelect.options.length === 1) {
    giveaways.forEach(g => {
      const option = document.createElement('option');
      option.value = g.id;
      option.textContent = `${g.title} (${g.status})`;
      filterSelect.appendChild(option);
    });
  }
  
  list.innerHTML = '<p style="text-align:center;opacity:0.5">Loading...</p>';
  
  try {
    let url = '/api/giveaway/entries';
    if (selectedGiveaway) {
      url += `?giveaway_id=${selectedGiveaway}`;
    }
    
    const response = await fetch(url, {
      headers: {
        'Authorization': 'Bearer ' + authToken
      }
    });
    const data = await response.json();
    
    list.innerHTML = '';
    
    if (data.success && data.entries.length > 0) {
      countEl.textContent = data.entries.length;
      
      data.entries.forEach(entry => {
        const div = document.createElement('div');
        div.className = 'list-item';
        const winnerBadge = entry.is_winner ? '<span style="color:#3CFF8F;font-weight:bold"> 🏆 WINNER</span>' : '';
        const giveawayInfo = entry.giveaway_title ? `<p style="color:#b7c5ff;font-size:12px">📦 ${entry.giveaway_title}</p>` : '';
        div.innerHTML = `
          <p><strong>${entry.twitter_handle || entry.email || 'N/A'}</strong>${winnerBadge}</p>
          ${giveawayInfo}
          <p style="color:#7afcff">Reply: <a href="${entry.reply_link}" target="_blank">${entry.reply_link || 'N/A'}</a></p>
          <p style="color:#7afcff">${entry.wallet_address}</p>
          <p style="font-size:11px;opacity:0.6">${new Date(entry.created_at).toLocaleString()}</p>
        `;
        list.appendChild(div);
      });
    } else {
      countEl.textContent = '0';
      list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#9fb2ff">No entries yet</p></div>';
    }
  } catch (e) {
    list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#ff9b9b">Error loading entries</p></div>';
    console.error(e);
  }
}

// Visitor Stats
function refreshVisitorStats() {
  const data = JSON.parse(localStorage.getItem('visitorData') || '{}');
  const stats = document.getElementById('visitorStats');
  
  stats.innerHTML = `
    <p>📊 Current Period: <strong>${data.currentVisitors || 0}</strong> visitors</p>
    <p>📅 Daily Total: <strong>${data.dailyVisitors || 0}</strong> visitors</p>
    <p style="font-size:12px;opacity:0.7">Updates every 15 minutes</p>
  `;
}

// Partnership Functions
function addPartnership() {
  const title = document.getElementById('partnerTitle').value.trim();
  const desc = document.getElementById('partnerDesc').value.trim();
  const taskStr = document.getElementById('partnerTasks').value.trim();
  
  if (!title || !desc || !taskStr) {
    alert('Fill all partnership fields');
    return;
  }
  
  const tasks = taskStr.split(',').map(t => t.trim()).filter(Boolean);
  partnershipData.partnerships.push({ title, desc, tasks, date: new Date().toLocaleString() });
  
  document.getElementById('partnerTitle').value = '';
  document.getElementById('partnerDesc').value = '';
  document.getElementById('partnerTasks').value = '';
  
  localStorage.setItem('partnershipData', JSON.stringify(partnershipData));
  refreshPartnerships();
}

function removePartnership(idx) {
  partnershipData.partnerships.splice(idx, 1);
  localStorage.setItem('partnershipData', JSON.stringify(partnershipData));
  refreshPartnerships();
}

function refreshPartnerships() {
  const list = document.getElementById('partnershipsList');
  list.innerHTML = '';
  
  partnershipData.partnerships.forEach((partner, idx) => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
      <p><strong>${partner.title}</strong></p>
      <p style="color:#9fb2ff;font-size:13px">${partner.desc}</p>
      <p style="color:#7afcff;font-size:12px">${partner.tasks.join(', ')}</p>
      <button class="btn-small" onclick="removePartnership(${idx})" style="margin-top:6px">Delete</button>
    `;
    list.appendChild(div);
  });
  
  if (partnershipData.partnerships.length === 0) {
    list.innerHTML = '<div class="list-item"><p style="text-align:center;color:#9fb2ff">No partnerships yet</p></div>';
  }
}

async function editGiveawayDesc(giveawayId) {
  const giveaway = giveaways.find(g => g.id === giveawayId);
  if (!giveaway) return;
  
  const newDesc = prompt('Edit description:', giveaway.description || '');
  if (newDesc === null) return;
  
  try {
    const response = await fetch('/api/giveaway/giveaways', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({
        id: giveawayId,
        description: newDesc
      })
    });
    
    const data = await response.json();
    if (data.success) {
      refreshGiveaways();
      alert('Description updated!');
    } else {
      alert('Failed to update description');
    }
  } catch (e) {
    alert('Error updating description');
  }
}

async function startGiveaway() {
  const giveawayId = document.getElementById('giveawayTaskSelect').value;
  if (!giveawayId) {
    alert('Select a giveaway first');
    return;
  }
  
  if (!confirm('Start this giveaway now?')) return;
  
  try {
    const response = await fetch('/api/giveaway/control', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({
        id: parseInt(giveawayId),
        action: 'start'
      })
    });
    
    const data = await response.json();
    if (data.success) {
      refreshGiveaways();
      updateSelectedGiveawayDisplay();
      alert('Giveaway started!');
    } else {
      alert('Failed: ' + (data.message || 'Unknown error'));
    }
  } catch (e) {
    alert('Error starting giveaway');
  }
}

async function endGiveaway() {
  const giveawayId = document.getElementById('giveawayTaskSelect').value;
  if (!giveawayId) {
    alert('Select a giveaway first');
    return;
  }
  
  if (!confirm('End this giveaway now?')) return;
  
  try {
    const response = await fetch('/api/giveaway/control', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({
        id: parseInt(giveawayId),
        action: 'end'
      })
    });
    
    const data = await response.json();
    if (data.success) {
      refreshGiveaways();
      updateSelectedGiveawayDisplay();
      alert('Giveaway ended!');
    } else {
      alert('Failed: ' + (data.message || 'Unknown error'));
    }
  } catch (e) {
    alert('Error ending giveaway');

async function drawWinners() {
  const giveawayId = document.getElementById('giveawayTaskSelect').value;
  
  if (!giveawayId) {
    alert('Please select a giveaway first');
    return;
  }
  
  const giveaway = giveaways.find(g => g.id == giveawayId);
  if (!giveaway) {
    alert('Giveaway not found');
    return;
  }
  
  if (giveaway.status !== 'ended') {
    alert('Giveaway must be ended before drawing winners!');
    return;
  }
  
  if (!confirm(`Draw ${giveaway.winner_count || 1} winner(s) for this giveaway?`)) return;
  
  try {
    const response = await fetch('/api/giveaway/winner', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({ 
        giveaway_id: parseInt(giveawayId),
        count: giveaway.winner_count || 1
      })
    });
    
    const data = await response.json();
    
    if (data.success && data.winners) {
      const display = document.getElementById('winnersDisplay');
      const winnersList = document.getElementById('winnersList');
      winnersList.innerHTML = data.winners.map((w, i) => `
        <p style="margin:8px 0;padding:8px;background:rgba(60,255,143,0.1);border-radius:6px">
          <strong>${i + 1}.</strong> ${w.twitter_handle || 'N/A'}<br>
          <span style="font-size:12px;opacity:0.8">${w.wallet_address}</span>
          ${w.prize_won ? `<br><span style="color:#FFD36A">🏆 ${w.prize_won}</span>` : ''}
        </p>
      `).join('');
      display.style.display = 'block';
      refreshSubmissions();
      alert(`${data.winners.length} winner(s) selected!`);
    } else {
      alert(data.message || 'No entries available!');
    }
  } catch (e) {
    alert('Error drawing winners');
    console.error(e);
  }
}

function resetGiveaway() {
  alert('⚠️ Contact developer to reset giveaway database');
}

async function exportWinners() {
  try {
    const response = await fetch('/api/giveaway/export-winners', {
      headers: {
        'Authorization': 'Bearer ' + authToken
      }
    });
    
    if (response.ok) {
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `giveaway_winners_${Date.now()}.csv`;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
    } else {
      const data = await response.json();
      alert('Export failed: ' + (data.message || 'Unknown error'));
    }
  } catch (e) {
    alert('Error exporting winners');
    console.error(e);
  }
}

// Event listeners for giveaway task select
document.getElementById('giveawayTaskSelect')?.addEventListener('change', () => {
  refreshTasks();
  updateSelectedGiveawayDisplay();
});

function updateSelectedGiveawayDisplay() {
  const select = document.getElementById('giveawayTaskSelect');
  const display = document.getElementById('selectedGiveawayDisplay');
  const statusDisplay = document.getElementById('selectedGiveawayStatus');
  const timerDisplay = document.getElementById('giveawayTimer');
  const startBtn = document.getElementById('startGiveawayBtn');
  const endBtn = document.getElementById('endGiveawayBtn');
  const drawBtn = document.getElementById('drawWinnersBtn');
  
  if (select && display) {
    const selectedId = select.value;
    if (selectedId) {
      const selectedGiveaway = giveaways.find(g => g.id == selectedId);
      if (selectedGiveaway) {
        display.textContent = selectedGiveaway.title;
        display.style.color = '#3CFF8F';
        statusDisplay.textContent = selectedGiveaway.status.toUpperCase();
        statusDisplay.style.color = selectedGiveaway.status === 'live' ? '#7afcff' : selectedGiveaway.status === 'ended' ? '#ff9b9b' : '#FFD36A';
        
        // Update timer
        updateGiveawayTimer(selectedGiveaway);
        
        // Update button states
        startBtn.disabled = selectedGiveaway.status === 'live' || selectedGiveaway.status === 'ended';
        endBtn.disabled = selectedGiveaway.status !== 'live';
        drawBtn.disabled = selectedGiveaway.status !== 'ended';
        
        return;
      }
    }
    display.textContent = 'None';
    display.style.color = '#ff9b9b';
    statusDisplay.textContent = '-';
    timerDisplay.textContent = '⏱️ Select a giveaway';
    startBtn.disabled = true;
    endBtn.disabled = true;
    drawBtn.disabled = true;
  }
}

let timerInterval;
function updateGiveawayTimer(giveaway) {
  const timerDisplay = document.getElementById('giveawayTimer');
  if (!timerDisplay || !giveaway) return;
  
  if (timerInterval) clearInterval(timerInterval);
  
  const updateTimer = () => {
    const now = new Date().getTime();
    const start = new Date(giveaway.start_time).getTime();
    const end = new Date(giveaway.end_time).getTime();
    
    if (giveaway.status === 'ended' || now > end) {
      timerDisplay.innerHTML = '⏱️ <span style="color:#ff9b9b">Giveaway Ended</span>';
      clearInterval(timerInterval);
      return;
    }
    
    if (now < start) {
      const distance = start - now;
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
      
      timerDisplay.innerHTML = `⏱️ Starts in: <span style="color:#FFD36A">${days}d ${hours}h ${minutes}m ${seconds}s</span>`;
    } else {
      const distance = end - now;
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
      
      timerDisplay.innerHTML = `⏱️ Ends in: <span style="color:#3CFF8F">${days}d ${hours}h ${minutes}m ${seconds}s</span>`;
    }
  };
  
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
}

setInterval(refreshVisitorStats, 900000);
